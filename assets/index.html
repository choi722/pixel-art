<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090914">
  <title>픽셀 볼 피하기</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/mobile-layout.css">
  <script src="/game.js" defer></script>
  <script src="/mobile-layout.js" defer></script>
</head>
<body>
  <main class="game-shell">
    <section class="game-frame" aria-label="픽셀 볼 피하기 게임">
      <canvas id="game" width="1920" height="1080" aria-label="WASD로 조작하는 픽셀 볼 피하기 게임"></canvas>
      <div class="hud" id="hud" hidden>
        <span class="hud-item" id="wave-label">WAVE 1 · 기본</span>
        <span class="hud-item" id="time-label">생존 0.0초</span>
        <span class="hud-item" id="sound-label">사운드 ON · M 키로 끄기</span>
      </div>
      <aside class="admin-panel" id="admin-panel" aria-label="개발자 설정" hidden>
        <strong class="admin-title">DEV SETTINGS</strong>
        <label class="speed-control" for="speed-slider"><span>플레이어 속도</span><output id="speed-value" for="speed-slider">150</output></label>
        <input id="speed-slider" type="range" min="80" max="360" step="10" value="150" aria-label="플레이어 속도">
        <label class="invincible-control" for="invincible-toggle"><input id="invincible-toggle" type="checkbox">무적 모드</label>
        <small>WASD 이동 · Esc로 패널 닫기</small>
      </aside>
      <section class="menu-overlay" id="overlay" aria-labelledby="title">
        <div class="menu-panel">
          <div class="menu-kicker"><span class="kicker-line"></span>PIXEL ARCADE<span class="kicker-line"></span></div>
          <h1 id="title">볼 피하기</h1>
          <p class="menu-description" id="description">날아오는 공을 피하며 웨이브를 돌파하세요.<br>웨이브 5부터 저격수가 돌진합니다.</p>
          <div class="start-prompt" aria-hidden="true"><span class="enter-key">ENTER</span><span class="prompt-label">시작하려면 Enter를 누르세요</span></div>
          <div class="menu-divider"></div>
          <div class="control-guide">
            <div class="wasd-guide" aria-label="WASD 키로 이동"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></div>
            <span>이동</span><span class="guide-separator"></span><kbd class="space-key">SPACE</kbd><span>시작 / 다시 하기</span>
          </div>
          <p class="mouse-notice">M 키: 사운드 켜기/끄기 · 키보드 조작 전용</p>
        </div>
      </section>
      <section class="mobile-controls" id="mobile-controls" aria-label="모바일 게임 조작">
        <button class="mobile-start" id="mobile-start" type="button">게임 시작</button>
        <div class="mobile-pad-area" id="mobile-pad-area">
          <div class="joystick" id="joystick" role="application" aria-label="가상 조이스틱으로 이동"><div class="joystick-knob" id="joystick-knob"></div></div>
          <div class="dpad" id="dpad" aria-label="방향키로 이동" hidden>
            <button type="button" data-dir="up" aria-label="위">▲</button>
            <button type="button" data-dir="left" aria-label="왼쪽">◀</button>
            <button type="button" data-dir="down" aria-label="아래">▼</button>
            <button type="button" data-dir="right" aria-label="오른쪽">▶</button>
          </div>
        </div>
        <button class="control-settings-button" id="control-settings-button" type="button" aria-expanded="false" aria-controls="control-settings">조작 설정</button>
        <aside class="control-settings" id="control-settings" aria-label="모바일 조작 설정" hidden>
          <strong>모바일 조작 설정</strong>
          <p>조작 방식과 화면 방향을 선택하세요.</p>
          <div class="control-mode-options">
            <button type="button" data-control-mode="joystick">조이스틱</button>
            <button type="button" data-control-mode="dpad">방향키</button>
          </div>
          <div class="display-mode-options" aria-label="화면 방향 설정">
            <button type="button" data-display-mode="auto">자동 맞춤</button>
            <button type="button" data-display-mode="portrait">세로 모드</button>
            <button type="button" data-display-mode="landscape">가로 모드</button>
          </div>
          <p class="orientation-hint" id="orientation-hint">자동 맞춤: 기기 방향에 맞춰 화면을 배치합니다.</p>
          <button type="button" class="settings-close" id="settings-close">닫기</button>
        </aside>
      </section>
    </section>
  </main>
</body>
</html>
